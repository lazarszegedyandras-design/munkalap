name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: |
          export RUNTIME_DIR="$RUNNER_TEMP/munkalap-runtime"
          mkdir -p "$RUNTIME_DIR"
          python -m pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: |
          npm run test:datetime
          npm run test:work-orders
          npm run test:modules
      - name: Build frontend
        run: npm run build

  docker-release:
    name: Docker release suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create tracked-source manifest
        run: python scripts/create_release_manifest.py
      - name: Run isolated Docker release suite
        run: sh ./test-release.sh --suite all
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
