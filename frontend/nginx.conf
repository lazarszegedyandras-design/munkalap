map $http_x_forwarded_for $client_ip_for_backend {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map $http_x_forwarded_proto $client_proto_for_backend {
    default $http_x_forwarded_proto;
    "" $scheme;
}

limit_req_zone $client_ip_for_backend zone=api_general:10m rate=30r/s;
limit_req_zone $client_ip_for_backend zone=auth_login:10m rate=30r/m;
limit_conn_zone $client_ip_for_backend zone=conn_per_ip:10m;

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn conn_per_ip 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is ignored by browsers on plain HTTP. In production the outer TLS
    # reverse proxy must expose this response only via HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location ^~ /api/auth/mfa/ {
        limit_req zone=auth_login burst=8 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location = /api/mobile/auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location = /api/mobile/auth/mfa/verify {
        limit_req zone=auth_login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location = /api/mobile/auth/refresh {
        limit_req zone=auth_login burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    # A backend végpontonként ellenőrzi a tényleges fájlméretet. Az Nginx
    # korlátja technikai ráhagyást tartalmaz a multipart keretre.
    location = /api/settings/restore {
        limit_req zone=api_general burst=20 nodelay;
        client_max_body_size 501m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location ^~ /api/imports/global/ {
        limit_req zone=api_general burst=20 nodelay;
        client_max_body_size 51m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        client_max_body_size 26m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_backend;
        proxy_set_header X-Forwarded-For $client_ip_for_backend;
        proxy_set_header X-Forwarded-Proto $client_proto_for_backend;
        proxy_hide_header Server;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
